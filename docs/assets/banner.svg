<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Boost Studio: content toolkit for Kurdish and Arabic brands">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#c9c9ee"/></pattern>
  </defs>
  <rect width="1280" height="400" fill="#f7f7ff"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect x="6" y="6" width="1268" height="388" fill="none" stroke="#111" stroke-width="6"/>

  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900">
    <text x="76" y="196" font-size="112" fill="#1100ff">BOOST</text>
    <text x="70" y="190" font-size="112" fill="#111">BOOST</text>
    <text x="70" y="298" font-size="112" fill="#111" stroke="#111" stroke-width="2">STUDIO</text>
    
  </g>
  <rect x="590" y="214" width="250" height="78" fill="#8cff8c" stroke="#111" stroke-width="5" transform="rotate(-3 715 253)"/>
  <text x="715" y="266" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="30" text-anchor="middle" fill="#111" transform="rotate(-3 715 253)">RTL FIRST</text>

  <text x="72" y="352" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#111">Content toolkit for Kurdish &amp; Arabic brands</text>

  <!-- stickers -->
  <g font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="22">
    <rect x="800" y="40" width="190" height="48" fill="#d6006e" stroke="#111" stroke-width="4"/>
    <text x="895" y="72" text-anchor="middle" fill="#fff">CLAUDE CODE</text>
    <rect x="1010" y="40" width="200" height="48" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="1110" y="72" text-anchor="middle" fill="#111">REMOTION</text>
  </g>

  <!-- phone mock -->
  <g transform="rotate(5 1010 250)">
    <rect x="918" y="104" width="224" height="268" rx="30" fill="#111" transform="translate(10 10)"/>
    <rect x="918" y="104" width="224" height="268" rx="30" fill="#1100ff" stroke="#111" stroke-width="5"/>
    <rect x="936" y="124" width="188" height="228" rx="18" fill="#fff"/>
    <rect x="1000" y="146" width="108" height="34" rx="14" fill="#1100ff"/>
    <rect x="952" y="196" width="130" height="34" rx="14" fill="#e6e6fa" stroke="#111" stroke-width="2"/>
    <rect x="952" y="246" width="156" height="34" rx="14" fill="#e6e6fa" stroke="#111" stroke-width="2"/>
    <rect x="952" y="304" width="156" height="34" rx="10" fill="#8cff8c" stroke="#111" stroke-width="3"/>
  </g>
</svg>
